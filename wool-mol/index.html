        <div id="modal" class="modal">

    <div id="footer-placeholder"></div>
    <script>
        // ハンバーガーメニューの開閉
        const toggle = document.querySelector('.menu-toggle');
        const nav = document.querySelector('.nav-menu');

        toggle.addEventListener('click', () => {
            nav.classList.toggle('open');
        });

        // メニュー外クリックで閉じる
        document.addEventListener('click', (e) => {
            const isClickInsideMenu = nav.contains(e.target) || toggle.contains(e.target);
            if (!isClickInsideMenu && nav.classList.contains('open')) {
                nav.classList.remove('open');
            }
        });
        // モーダル表示（画像クリック）
        document.querySelectorAll('a[href$=".jpg"]').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const modal = document.getElementById("modal");
                const modalImg = document.getElementById("modal-img");
                modal.style.display = "block";
                modalImg.src = this.href;
                document.body.classList.add("modal-open");
            });
        });

        // モーダル全体をクリックしたら閉じる（画像も含めてOK）
        document.getElementById("modal").addEventListener("click", function () {
            this.style.display = "none";
            document.body.classList.remove("modal-open");
        });

        // ナビゲーションの読み込み
        fetch("/nav.html")
            .then(res => {
                if (!res.ok) {
                    throw new Error("ナビゲーションの読み込みに失敗しました");
                }
                return res.text();
            })
            .then(data => {
                document.getElementById("nav-placeholder").innerHTML = data;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("nav-placeholder").innerHTML = "<nav>メニューを読み込めませんでした</nav>";
            });

        // フッター読み込み
        fetch("/footer.html")
            .then(res => res.text())
            .then(data => document.getElementById("footer-placeholder").innerHTML = data)
            .catch(() => document.getElementById("footer-placeholder").innerHTML = "<footer>フッターを読み込めませんでした</footer>");


    </script>
