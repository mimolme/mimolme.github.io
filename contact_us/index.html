<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <meta name="description" content="もるらぼ -GuineaPigLab- は、モルモットと一緒に暮らすのに役立つ情報を提供するサイトです。">
  <meta name="keywords"
    content="もるらぼ, もるラボ, モルモット研究室, モルモットを飼育するための実用書, モルモット, mimolme, Guinea pig Laboratory, モルモットの飼い方, モルモットと暮らしたい, モルモットの飼育方法, モルモット観察">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-85BH18E352"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-85BH18E352');
  </script>
</head>

<body>
  <header id="top">
    <a href="https://mimolme.github.io">
      <img src="https://mimolme.github.io/img/MolLabTop.png" alt="top_img" class="top-image">
    </a>
    <button class="menu-toggle" aria-label="メニュー切り替え">&#9776;</button>
    <div id="nav-placeholder"></div>

  </header>
  <main>
    <section>
      <h2 style="color: #282828;">お問い合わせ</h2>
      <P style="color: #888888;"><i class="fa-solid fa-envelope"></i>&nbsp;mimolme.v2[at]gmail.com</p>
      <small>必ず件名と氏名を記載してください。内容によってはご返信できない場合があります。予めご了承ください。</small>
    </section>

    <a href="#top" class="back-to-top">▲</a>
  </main>
  <div id="footer-placeholder"></div>


  <script>
    // ハンバーガーメニューの開閉
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.nav-menu');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('open');
    });

    // メニュー外クリックで閉じる
    document.addEventListener('click', (e) => {
      const isClickInsideMenu = nav.contains(e.target) || toggle.contains(e.target);
      if (!isClickInsideMenu && nav.classList.contains('open')) {
        nav.classList.remove('open');
      }
    });
    // ナビゲーションの読み込み
    fetch("/nav.html")
      .then(res => {
        if (!res.ok) {
          throw new Error("ナビゲーションの読み込みに失敗しました");
        }
        return res.text();
      })
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;
      })
      .catch(err => {
        console.error(err);
        document.getElementById("nav-placeholder").innerHTML = "<nav>メニューを読み込めませんでした</nav>";
      });

    // フッター読み込み
    fetch("/footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer-placeholder").innerHTML = data)
      .catch(() => document.getElementById("footer-placeholder").innerHTML = "<footer>フッターを読み込めませんでした</footer>");

  </script>
</body>

</html>
