    <br>
    <section>
      <div class="box-heading">
        <h3 id="nasal">鼻音</h3>
      </div>
      <p>
        モルモットの鼻に異物が入った時の音声です。
      </p>
      <div class="audio-player">
  <button class="play-btn">▶️</button>
  <div class="time"><span class="current">0:00</span> / <span class="duration">0:00</span></div>
  <input type="range" class="volume-slider" min="0" max="1" step="0.01" value="1">
  <button class="volume-btn">🔊</button>
  <button class="menu-btn" title="More options"></button>

  <audio id="audio" src="https://mimolme.github.io/audio/mol_nasal.mp3"></audio>
</div>

    <!-- モーダル -->

      <img class="modal-content" id="modal-img">
    </div>
    </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2023-2025 mimolme</p>
  </footer>

  <script>
    // ハンバーガーメニューの開閉
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('.nav-menu');

    toggle.addEventListener('click', () => {
      nav.classList.toggle('open');
    });

    // メニュー外クリックで閉じる
    document.addEventListener('click', (e) => {
      const isClickInsideMenu = nav.contains(e.target) || toggle.contains(e.target);
      if (!isClickInsideMenu && nav.classList.contains('open')) {
        nav.classList.remove('open');
      }
    });
    // モーダル表示（画像クリック）
    document.querySelectorAll('a[href$=".jpg"]').forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const modal = document.getElementById("modal");
        const modalImg = document.getElementById("modal-img");
        modal.style.display = "block";
        modalImg.src = this.href;
      });
    });

    // モーダル全体をクリックしたら閉じる（画像も含めてOK）
    document.getElementById("modal").addEventListener("click", function () {
      this.style.display = "none";
    });

    // 音声プレイヤーの機能
    const audio = document.getElementById('audio');
  const playBtn = document.querySelector('.play-btn');
  const volumeSlider = document.querySelector('.volume-slider');
  const volumeBtn = document.querySelector('.volume-btn');
  const currentTimeEl = document.querySelector('.current');
  const durationEl = document.querySelector('.duration');

  function formatTime(time) {
    const min = Math.floor(time / 60);
    const sec = Math.floor(time % 60).toString().padStart(2, '0');
    return `${min}:${sec}`;
  }

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playBtn.textContent = '⏸️';
    } else {
      audio.pause();
      playBtn.textContent = '▶️';
    }
  });

  volumeSlider.addEventListener('input', () => {
    audio.volume = volumeSlider.value;
    volumeBtn.textContent = audio.volume == 0 ? '🔇' : '🔊';
  });

  volumeBtn.addEventListener('click', () => {
    audio.muted = !audio.muted;
    volumeBtn.textContent = audio.muted ? '🔇' : '🔊';
    volumeSlider.value = audio.muted ? 0 : audio.volume;
  });
  </script>
